name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-svg

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Run Build Script
        shell: pwsh
        run: |
          ./build.ps1 > build.log 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "Build script failed with exit code $exitCode"
            exit 1
          }

      - name: Upload Build Logs via API
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Write-Host "Uploading build.log via GitHub API..."
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("build.log"))
            $sha = $null
            try {
              $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/itznan/pankha/contents/build.log" -Method Get -Headers @{
                Authorization = "token ${{ secrets.GITHUB_TOKEN }}"
                "User-Agent" = "PowerShell"
              }
              $sha = $existing.sha
            } catch {
              # File doesn't exist
            }
            
            $body = @{
              message = "chore: upload build.log [skip ci]"
              content = $content
              branch = "main"
            }
            if ($sha) {
              $body.sha = $sha
            }
            $bodyJson = $body | ConvertTo-Json -Compress
            
            Invoke-RestMethod -Uri "https://api.github.com/repos/itznan/pankha/contents/build.log" -Method Put -Headers @{
              Authorization = "token ${{ secrets.GITHUB_TOKEN }}"
              "Content-Type" = "application/json"
              "User-Agent" = "PowerShell"
            } -Body $bodyJson
            Write-Host "Log uploaded successfully."
          }

      - name: Upload Installer Artifact
        if: startsWith(github.ref, 'refs/tags/v') == false
        uses: actions/upload-artifact@v4
        with:
          name: pankha_installer
          path: installer/pankha_installer.exe
          if-no-files-found: error

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/pankha_installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
