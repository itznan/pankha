name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build C# Frontend
        run: dotnet publish src/pankha.csproj -c Release -r win-x64 --self-contained true

      - name: Deploy Dependencies
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Path "dist\*" -Recurse -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          
          Copy-Item -Path "src\bin\Release\net10.0-windows\win-x64\publish\FanControlHost.exe" -Destination "dist\" -Force

      - name: Build Installer
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $isccPath) {
              & $isccPath installer\setup.iss
          } else {
              Write-Error "Inno Setup compiler not found!"
              exit 1
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pankha_installer
          path: installer/pankha_installer.exe
          if-no-files-found: error

      - name: Create Release and Upload Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.1.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Release v2.1.{0}', github.run_number) }}
          body: |
            Automated build update.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: installer/pankha_installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
